spring.application.name=java
spring.datasource.url=jdbc:mariadb://localhost:3306/pokedex?createDatabaseIfNotExist=true
spring.datasource.username=pokedex
spring.datasource.password=pokedex
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update

# Origens liberadas no CORS, separadas por vírgula (sem "*")
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

